name: Update CN Rules

on:
  schedule:
    # Run daily at 04:00 UTC (12:00 Beijing Time) to pull upstream updates
    - cron: '0 4 * * *'
  push:
    branches:
      - main
    paths:
      - 'source/**'
  workflow_dispatch: # Supports manual triggers

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install sing-box
        run: |
          set -e
          # Get latest release version
          SINGBOX_VERSION=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"v\(.*\)".*/\1/')
          echo "sing-box version: ${SINGBOX_VERSION}"
          curl -Lo sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box /usr/local/bin/
          rm -rf sing-box.tar.gz sing-box-*/
          sing-box version

      - name: Generate sing-box CN rule-sets
        run: python scripts/convert.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Changes detected:"
            git diff --stat
            git ls-files --others --exclude-standard
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "🔄 Auto-update CN rules: ${DATE}"
          git push
